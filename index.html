
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Bez maximum-scale/user-scalable: blokowanie powiększania łamie WCAG 1.4.4,
         a paczka motywu wprost wymaga zachowania dostępności. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Your English AI Coach - CRIBRO ENGLISH</title>
    <meta name="theme-color" content="#09101c" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="description" content="Your English AI Coach - Spersonalizowane lekcje angielskiego z AI" />
    <meta property="og:title" content="Your English AI Coach" />
    <meta property="og:description" content="Twoja osobista platforma do nauki języka angielskiego z wykorzystaniem sztucznej inteligencji." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <script>
      // Safe globals for browser compatibility
      window.process = window.process || { env: {} };
      window.global = window;

      // Uncaught Error Reporter Overlay to prevent blank screens
      window.addEventListener('error', function(event) {
        if (isDevToolingNoise(event.error, event.filename)) return;
        showErrorOverlay(event.error || new Error(event.message));
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (isDevToolingNoise(event.reason)) return;
        showErrorOverlay(event.reason || new Error('Unhandled promise rejection'));
      });

      /**
       * Odsiewa awarie samego narzędzia deweloperskiego.
       *
       * Klient HMR Vite'a rzuca "WebSocket closed without opened" za każdym razem,
       * gdy serwer dev zniknie — po zatrzymaniu go, restarcie albo uśpieniu
       * komputera. To nie jest błąd aplikacji, ale trafiał na tę samą nakładkę
       * co prawdziwa awaria startu i wyglądał jak zepsuty kod. W wersji
       * produkcyjnej ta ścieżka w ogóle nie istnieje, bo nie ma tam klienta HMR.
       */
      function isDevToolingNoise(err, filename) {
        var source = (filename || (err && err.stack) || '') + '';
        if (source.indexOf('/@vite/') !== -1) return true;
        var message = (err && err.message ? err.message : String(err || '')) + '';
        return message.indexOf('WebSocket closed without opened') !== -1;
      }

      function showErrorOverlay(err) {
        const root = document.getElementById('root');
        if (root && root.innerHTML.trim() !== '') return; // React has already rendered or handled it
        
        let overlay = document.getElementById('dev-error-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'dev-error-overlay';
          overlay.style.position = 'fixed';
          overlay.style.top = '0';
          overlay.style.left = '0';
          overlay.style.width = '100vw';
          overlay.style.height = '100vh';
          overlay.style.backgroundColor = '#0c0f1a';
          overlay.style.color = '#f87171';
          overlay.style.fontFamily = 'monospace';
          overlay.style.padding = '40px';
          overlay.style.boxSizing = 'border-box';
          overlay.style.zIndex = '999999';
          overlay.style.overflow = 'auto';
          overlay.innerHTML = `
            <div style="max-width: 800px; margin: 0 auto; background: #1a1e30; border: 1px solid #ef4444; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
              <h2 style="color: #ef4444; margin-top: 0; font-size: 20px; border-bottom: 1px solid rgba(239, 68, 68, 0.2); padding-bottom: 12px;">🚨 Application Initialization Error</h2>
              <p style="color: #cbd5e1; font-size: 14px; line-height: 1.6;">A runtime error occurred before the application could render. See details below:</p>
              <pre id="error-stack" style="background: #0f1220; color: #f87171; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05);"></pre>
              <button onclick="window.location.reload()" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: sans-serif; transition: background 0.2s;">Reload Page</button>
            </div>
          `;
          document.body.appendChild(overlay);
        }
        const stackElement = document.getElementById('error-stack');
        if (stackElement) {
          stackElement.innerText = err && err.stack ? err.stack : String(err);
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-base-100 text-content min-h-screen antialiased selection:bg-primary/30 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
